[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cspilot"
version = "0.1.0"
description = "Command line tools for computational chemistry structure workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ase>=3.23.0",
    "langgraph>=0.3.0",
    "openai-agents>=0.17.3",
    "orca-pi>=0.1.0",
    "pydantic>=2.8.0",
    "pubchempy>=1.0.4",
    "python-dotenv>=1.0.1",
    "rdkit>=2025.9.6",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "psmiles[mordred,polybert]",
    "langchain-community>=0.4.2",
    "ddgs>=9.16.1",
    "sentence-transformers>=6.3.0",
    "faiss-cpu>=1.16.0",
    "openai>=2.38.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.2", "pytest-cov>=5.0.0", "ruff>=0.5.0"]
mace = ["mace-torch>=0.3.0"]
stk = ["stk", "polars[rtcompat]"]
rag = [
    "faiss-cpu>=1.9.0",
    "pypdf>=5.0.0",
    "sentence-transformers>=3.0.0",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-autorefs",
    "mkdocs-section-index",
]

[project.scripts]
cspilot = "cspilot.cli:app"
cspiolt = "cspilot.cli:app"

[project.urls]
repository = "https://github.com/sandipgiri576/cspilot"
documentation = "https://sandipgiri576.github.io/cspilot/"
changelog = "https://github.com/sandipgiri576/cspilot/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cspilot = ["py.typed", "skills/*.md"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-p no:warnings", "--import-mode=importlib"]
xfail_strict = true
log_cli_level = "warn"
pythonpath = "src"
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "ANN", "D101", "D102", "D103", "D107"]
ignore = ["E501", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "D"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true

[tool.uv.sources]
psmiles = { git = "https://github.com/kuennethgroup/psmiles.git" }
